# CI-Vorlage des Prozesses (D-004, D-006). Der Bootstrap legt sie als
# .github/workflows/ci.yml an und entfernt Jobs, die das Projekt nicht braucht.
#
# Pflicht-Check in der Schutzregel ist nur `gate`. Er hängt von allen Jobs ab
# und scheitert ausdrücklich, wenn einer nicht erfolgreich war: GitHub wertet
# übersprungene Pflicht-Checks als bestanden.
#
# Actions sind per Commit-SHA gepinnt (Tags lassen sich nachträglich umsetzen);
# Renovate hält die Pins aktuell (D-028).
#
# Voraussetzungen im Projekt:
#   - package.json mit "packageManager": "pnpm@<version>" und den Skripten
#     lint, check, test, build (test:e2e nur mit Job e2e)
#   - .node-version mit der Node-Version
#   - Dockerfile nur mit Job image-scan
#
# Wer einen Job entfernt, entfernt ihn auch aus `needs` von `gate`, sonst ist
# der Workflow ungültig und läuft gar nicht (siehe Test der Bot-Rechte).

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nur kritische Lücken machen das Gate rot (D-006).
      - run: pnpm audit --audit-level=critical

  fs-scan:
    name: filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  gate:
    name: gate
    needs: [checks, audit, fs-scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Alle Jobs erfolgreich?
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Ergebnisse: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "Mindestens ein Job war nicht erfolgreich ($r). Gate bleibt rot." >&2
              exit 1
            fi
          done
